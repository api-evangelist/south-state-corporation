apis:
  - aid: south-state-corporation:sec-edgar-filings
    name: SEC EDGAR Filings (SouthState Bank Corp, CIK 764038)
    description: >-
      Machine-readable filing data for SouthState Bank Corporation is available from the U.S. Securities
      and Exchange Commission, not from the company. The SEC EDGAR submissions API returns the full filing
      history for CIK 0000764038 (SouthState Bank Corp, ticker SSB; formerly SouthState Corp and SOUTH
      STATE Corp) as JSON. This is a third-party government API listed here because it is the only real
      programmatic access to this company's data.
    humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    baseURL: https://data.sec.gov
    tags:
      - Filings
      - SEC EDGAR
      - Third Party
    tags_raw:
      - Filings
      - SEC EDGAR
      - Third-Party
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    properties:
      - type: Documentation
        url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      - type: APIReference
        url: https://data.sec.gov/submissions/CIK0000764038.json
    x-evidence:
      verified: '2026-09-17'
      method: called the endpoint
      documentation: >-
        The SEC's EDGAR APIs page documents RESTful JSON APIs on data.sec.gov —
        https://data.sec.gov/submissions/CIK##########.json plus the XBRL companyconcept, companyfacts
        and frames APIs. No authentication or API key is required; a declared User-Agent and a
        10-request-per-second ceiling are the stated fair-access terms.
      endpoint_check: >-
        GET https://data.sec.gov/submissions/CIK0000764038.json returned HTTP 200 application/json
        naming "SouthState Bank Corp", ticker SSB on NYSE, SIC 6022 State Commercial Banks, incorporated
        in FL, with former names SouthState Corp (2021-09-15 to 2025-08-28) and SOUTH STATE Corp
        (2014-07-03 to 2021-09-03); most recent filing dated 2026-08-27.
