description: >-
  South State Corporation — now SouthState Bank Corporation (NYSE: SSB), the Winter Haven, Florida holding
  company for SouthState Bank, N.A. — is a Fortune 1000 regional bank serving consumer, mortgage, small
  business, commercial and wealth customers across the Southeast, Texas and Colorado. It publishes no
  developer program: the developer.southstatebank.com and api.southstatebank.com hosts that earlier
  versions of this record pointed at do not resolve in DNS, the bank's own curated llms.txt (served from
  www.southstatebank.com, last modified 2026-08-24) lists no API, developer or integration page, and
  commercial connectivity (Treasury Navigator, Integrated Payables) is file-based treasury tooling sold
  through a banker, not a public API. Consumer data access reaches SouthState through third-party
  aggregators. The only real programmatic access to the company is the SEC's own EDGAR API, listed here as
  a clearly labelled third-party government API.
